name: PHP CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  php-cs-fixer:
    name: PHP CS Fixer ${{ matrix.provider }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.provider }}
    concurrency:
      group: phpcsfixer-${{ matrix.provider }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        provider: [ "be-bpost", "be-geopunt", "be-spw", "be-urbis", "fr-addok" ]
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Install dependencies
      run: composer install --no-progress
    - name: Check coding standards with PHP CS Fixer
      run: composer run-script php-cs-fixer:check

  phpstan:
    name: PHPStan ${{ matrix.provider }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.provider }}
    concurrency:
      group: phpstan-${{ matrix.provider }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        provider: [ "be-bpost", "be-geopunt", "be-spw", "be-urbis", "fr-addok" ]
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Install dependencies
      run: composer install --no-progress
    - name: Run static analysis with PHPStan
      run: composer run-script phpstan

  phpunit:
    name: PHPUnit ${{ matrix.provider }} - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.provider }}
    concurrency:
      group: phpunit-${{ matrix.provider }}-${{ matrix.php-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        provider: [ "be-bpost", "be-geopunt", "be-spw", "be-urbis", "fr-addok" ]
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]
    steps:
    - uses: actions/checkout@v7
    - name: Use PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl
        coverage: xdebug
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Install dependencies
      run: composer install --no-progress
    - name: Run test suite
      run: composer run-script test-ci
  phpunit-nocache:
    name: PHPUnit ${{ matrix.provider }} (no cache)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.provider }}
    concurrency:
      group: phpunit-${{ matrix.provider }}-nocache
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        provider: [ "be-geopunt", "be-spw", "be-urbis", "fr-addok" ]
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        extensions: curl
        coverage: xdebug
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Install dependencies
      run: composer install --no-progress
    - name: Clear cached responses
      run: rm -rf ./Tests/.cached_responses/*
    - name: Run test suite
      run: composer run-script test-ci
